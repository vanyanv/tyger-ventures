<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tyger Ventures Burning Bright</title>
<meta name="description" content="Tyger Ventures. The tiger assembles from embers on a night-dark page.">
<meta name="theme-color" content="#06090a">
<meta name="robots" content="noindex">
<link rel="icon" href="/tiger-logo.svg" type="image/svg+xml">
<link rel="preload" href="/tiger-logo.svg" as="image" type="image/svg+xml">
<style>html{height:100%;height:100dvh;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one fixed screen at night. The tiger is built from embers in the upper two thirds,
   Blake's stanza sits beneath it, brand and contact ride the top edge. Single dark theme by design. */
:root{
  --night:#06090a;
  --bone:#ece6d8;
  --dim:#8f8b7d;
  --ember:#ff9a2e;
  --hot:#fff0c9;
  --line:rgba(236,230,216,.16);
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--bone);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{
  position:relative;z-index:1;height:100%;max-width:1240px;margin-inline:auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(6px,1.8vh,22px);
  padding-block:clamp(12px,2.6vh,28px);touch-action:none;
}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font:600 12px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;margin:0;white-space:nowrap}
.contact{
  position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;
  color:var(--bone);text-decoration:none;font:500 13px/1 var(--ui);letter-spacing:.02em;
  background:rgba(236,230,216,.05);transition:background .3s,color .3s;
}
.contact::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 68%,var(--ember) 84%,var(--hot) 92%,transparent 100%),linear-gradient(var(--line),var(--line));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 4s linear infinite;
}
.contact:hover{background:rgba(255,154,46,.14);color:var(--hot)}
.contact:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.contact svg{transition:transform .3s}
.contact:hover svg{transform:translate(2px,-2px)}
@keyframes spin{to{--a:360deg}}
.slot{position:relative;min-height:0}
.glow{
  position:absolute;inset:8% 4%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,138,30,.17),transparent 72%);
  animation:breathe 6.25s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.verse{margin:0;text-align:center}
.poem{
  margin:0;font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(17px,min(3.3vw,4.1vh),38px);line-height:1.2;text-wrap:balance;
}
.poem .l{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(1.5s + var(--i)*.28s)}
.poem .l b{
  font-weight:inherit;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,var(--bone) 0 40%,var(--hot) 47%,var(--ember) 52%,var(--bone) 60% 100%);
  background-size:300% 100%;background-position:100% 0;
  animation:burn 7s linear infinite;animation-delay:calc(3.2s + var(--i)*.45s);
}
@keyframes rise{from{opacity:0;filter:blur(10px);transform:translateY(.5em)}}
@keyframes burn{0%{background-position:100% 0}45%,100%{background-position:0 0}}
.cite{
  display:block;margin-top:clamp(6px,1.4vh,14px);font:500 11px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);font-style:normal;animation:rise .9s 2.8s both;
}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 11px/1.3 var(--ui);color:var(--dim);letter-spacing:.04em}
.foot p{margin:0}
.hint{display:inline-flex;align-items:center;gap:8px}
.hint i{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:breathe 2s ease-in-out infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (max-width:640px){
  .foot{flex-direction:column;gap:6px;text-align:center}
  .brand{font-size:11px;letter-spacing:.2em}
}
@media (max-height:430px){
  .cite{margin-top:4px}.hint{display:none}.foot{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .poem .l,.cite,.glow,.hint i,.contact::before,.poem .l b{animation:none}
  .poem .l b{background-position:100% 0}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="stage">
  <header class="top">
    <h1 class="brand">Tyger Ventures</h1>
    <a class="contact" href="https://www.tygerventures.com/contact" target="_blank" rel="noopener">Contact
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 9 9 2M3.5 2H9v5.5"/></svg>
    </a>
  </header>
  <div class="slot" id="slot"><div class="glow"></div><span class="sr">Tyger Ventures tiger logo, drawn in embers</span></div>
  <figure class="verse">
    <blockquote class="poem">
      <span class="l" style="--i:0"><b>Tyger Tyger, burning bright</b></span>
      <span class="l" style="--i:1"><b>In the forests of the night</b></span>
      <span class="l" style="--i:2"><b>What immortal hand or eye</b></span>
      <span class="l" style="--i:3"><b>Could frame thy fearful symmetry?</b></span>
    </blockquote>
    <figcaption class="cite">-William Blake, 1794</figcaption>
  </figure>
  <footer class="foot">
    <p class="hint"><i></i>Move or tap to stir the embers</p>
    <p>© 2026 Tyger Ventures, LLC. All Rights Reserved</p>
  </footer>
</div>

<script>
(function(){
  const cv=document.getElementById('fx'),ctx=cv.getContext('2d'),slot=document.getElementById('slot');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,parts=[],embers=[],box={x:0,y:0,w:1,h:1},t0=performance.now(),first=true;
  const ptr={x:-9999,y:-9999,on:false};
  const PAL=[];for(let i=0;i<24;i++){const h=i/23*1.5;const g=Math.min(255,112+h*105)|0,b=Math.min(230,18+h*h*95)|0,a=Math.min(1,.5+h*.4);PAL.push('rgba(255,'+g+','+b+','+a.toFixed(2)+')')}
  const img=new Image();
  img.onload=function(){layout();if(reduce){settle();draw(0)}else requestAnimationFrame(frame)};
  img.src='/tiger-logo.svg';

  function layout(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const r=slot.getBoundingClientRect();
    const s=Math.min(r.width/1284,r.height/755)*.96;
    const w=Math.max(40,Math.round(1284*s)),h=Math.max(24,Math.round(755*s));
    box={x:r.left+(r.width-w)/2,y:r.top+(r.height-h)/2,w:w,h:h};
    const off=document.createElement('canvas');off.width=w;off.height=h;
    const o=off.getContext('2d',{willReadFrequently:true});o.drawImage(img,0,0,w,h);
    const d=o.getImageData(0,0,w,h).data;
    let filled=0;for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>120)filled++;
    filled*=4;
    const budget=W<700?2800:5600;
    const step=Math.max(1.6,Math.sqrt(filled/budget));
    const pts=[];
    for(let y=step/2;y<h;y+=step)for(let x=step/2;x<w;x+=step){
      const jx=Math.min(w-1,Math.max(0,Math.round(x+(Math.random()-.5)*step*.5))),jy=Math.min(h-1,Math.max(0,Math.round(y+(Math.random()-.5)*step*.5)));
      if(d[(jy*w+jx)*4+3]>120)pts.push([box.x+jx,box.y+jy]);
    }
    for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const tmp=pts[i];pts[i]=pts[j];pts[j]=tmp}
    const size=Math.max(1.1,Math.min(2.4,step*.62));
    const next=[];
    for(let i=0;i<pts.length;i++){
      const p=parts[i]||{x:pts[i][0]+(Math.random()-.5)*W*.5,y:H+20+Math.random()*H*.7,vx:0,vy:0,
        s:Math.random()*6.283,h0:Math.random(),delay:first?Math.random()*1.1+((pts[i][0]-box.x)/w)*.7:0};
      p.tx=pts[i][0];p.ty=pts[i][1];p.z=size*(.75+Math.random()*.6);next.push(p);
    }
    parts=next;first=false;
    if(!embers.length)for(let i=0;i<(W<700?45:90);i++)embers.push({life:0,max:1,x:0,y:0,vx:0,vy:0,d:Math.random()*4+1.6});
  }
  function settle(){for(const p of parts){p.x=p.tx;p.y=p.ty}}
  function draw(t){
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    const cyc=(t*.16)%1.6,band=box.x+(cyc*1.4-.2)*box.w,bw=box.w*.11,R=Math.min(W,H)*.17,R2=R*R;
    for(let i=0;i<parts.length;i++){
      const p=parts[i];if(t<p.delay)continue;
      if(!reduce){
        const tx=p.tx+Math.sin(t*1.3+p.s)*.7,ty=p.ty+Math.cos(t*1.1+p.s*1.7)*.7;
        let ax=(tx-p.x)*.05,ay=(ty-p.y)*.05;
        if(ptr.on){const dx=p.x-ptr.x,dy=p.y-ptr.y,d2=dx*dx+dy*dy;
          if(d2<R2){let f=1-d2/R2;f*=f;const d=Math.sqrt(d2)+.01;ax+=dx/d*f*3.2;ay+=dy/d*f*3.2-f*.9}}
        p.vx=(p.vx+ax)*.86;p.vy=(p.vy+ay)*.86;p.x+=p.vx;p.y+=p.vy;
      }
      const q=(p.tx-band)/bw,sp=Math.abs(p.vx)+Math.abs(p.vy);
      let heat=.22+p.h0*.4+Math.exp(-q*q)*.95+Math.min(.8,sp*.1);
      ctx.fillStyle=PAL[Math.min(23,heat/1.5*23|0)];
      ctx.fillRect(p.x-p.z/2,p.y-p.z/2,p.z,p.z);
    }
    if(reduce||t<2.2)return;
    for(const e of embers){
      if(e.life<=0){if(e.d>0){e.d-=.016;continue}
        const src=parts[Math.random()*parts.length|0];if(!src)continue;
        e.x=src.x;e.y=src.y;e.vx=(Math.random()-.5)*.5;e.vy=-(.35+Math.random()*.9);e.max=e.life=1.6+Math.random()*2.4;e.d=Math.random()*1.5}
      e.life-=.016;e.x+=e.vx+Math.sin(t*2+e.max*9)*.25;e.y+=e.vy;
      const k=Math.max(0,e.life/e.max);
      ctx.fillStyle='rgba(255,'+(150+k*90|0)+','+(40+k*120|0)+','+(k*.85).toFixed(2)+')';
      const z=1+k*1.6;ctx.fillRect(e.x,e.y,z,z);
    }
  }
  function frame(now){draw((now-t0)/1000);requestAnimationFrame(frame)}
  function move(e){ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true}
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerdown',function(e){move(e);
    for(const p of parts){const dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.sqrt(dx*dx+dy*dy)+1,R=Math.min(W,H)*.32;
      if(d<R){const f=(1-d/R)*14;p.vx+=dx/d*f;p.vy+=dy/d*f-f*.25}}},{passive:true});
  const off=function(){ptr.on=false};
  window.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')off()},{passive:true});
  window.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointerleave',off);
  let rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(!img.complete)return;layout();if(reduce){settle();draw(0)}},120)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(img.complete&&img.naturalWidth){layout();if(reduce){settle();draw(0)}}});
})();
</script>
</body>
</html>
